name: CAGE Docs ZIP Sync + Build

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP in the repository to extract (for example incoming/CageDocs-update.zip). Leave blank to use the newest incoming/*.zip."
        required: false
        default: ""
      commit_changes:
        description: "Commit extracted/generated changes back to this branch"
        required: true
        type: boolean
        default: false
  push:
    paths:
      - "incoming/*.zip"

permissions:
  contents: write

concurrency:
  group: cage-docs-sync-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ZIP + sync tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip rsync zip
      - name: Resolve optional update ZIP
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ github.event.inputs.zip_path }}'
          archive=""
          if [[ -n "$requested" ]]; then
            [[ -f "$requested" ]] || { echo "Requested ZIP not found: $requested" >&2; exit 2; }
            archive="$requested"
          elif compgen -G 'incoming/*.zip' > /dev/null; then
            archive="$(ls -1t incoming/*.zip | head -n 1)"
          fi
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          if [[ -n "$archive" ]]; then echo "Using update archive: $archive"; else echo "No update ZIP supplied; building repository as checked out."; fi
      - name: Extract ZIP into repository
        if: steps.archive.outputs.path != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .cage-docs-incoming
          mkdir -p .cage-docs-incoming/extracted
          unzip -q "${{ steps.archive.outputs.path }}" -d .cage-docs-incoming/extracted
          shopt -s dotglob nullglob
          entries=(.cage-docs-incoming/extracted/*)
          source_root=".cage-docs-incoming/extracted"
          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then source_root="${entries[0]}"; fi
          rsync -a --delete-delay \
            --exclude '.git/' \
            --exclude '.github/workflows/cage-docs-zip-sync.yml' \
            --exclude 'incoming/' \
            --exclude 'artifacts/' \
            --exclude '.next/' \
            --exclude 'out/' \
            --exclude 'node_modules/' \
            "$source_root/" ./
          rm -rf .cage-docs-incoming
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate docs surface
        run: npm test
      - name: Build static Next.js docs
        run: npm run build
      - name: Assemble deployable ZIPs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          (cd out && zip -qr ../artifacts/CAGE-DOCS-NETLIFY-STATIC.zip .)
          zip -qr artifacts/CAGE-DOCS-SOURCE.zip . -x '.git/*' 'incoming/*' 'artifacts/*' '.next/*' 'out/*' 'node_modules/*' '*.zip'
      - name: Upload docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cage-docs-build-${{ github.run_number }}
          if-no-files-found: error
          compression-level: 6
          path: |
            artifacts/CAGE-DOCS-NETLIFY-STATIC.zip
            artifacts/CAGE-DOCS-SOURCE.zip
            out/
      - name: Commit synchronized sources
        if: (github.event_name == 'push' && steps.archive.outputs.path != '') || (github.event_name == 'workflow_dispatch' && github.event.inputs.commit_changes == 'true')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!incoming/*.zip' ':!artifacts/' ':!.next/' ':!out/' ':!node_modules/'
          if git diff --cached --quiet; then
            echo "No synchronized changes to commit."
          else
            git commit -m "build(cage-docs): sync ZIP update and rebuild static docs"
            git push
          fi
